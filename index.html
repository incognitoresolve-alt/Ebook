<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPROD | Bibliothèque Privée</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #12100E;
            --surface: #1A1715;
            --text: #EAE0D5;
            --muted: #8A817C;
            --gold: #C8A97E;
            --border: #2A2522;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 50px 25px;
            text-align: center;
        }

        .logo {
            width: 90px; height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--surface), var(--bg));
            border: 1px solid var(--border);
            margin: 0 auto 30px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Playfair Display', serif;
            font-size: 20px; font-weight: 600;
            color: var(--gold);
            letter-spacing: 2px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px; font-weight: 400;
            letter-spacing: 0.5px;
            margin-bottom: 50px;
        }

        .loading {
            font-family: 'Playfair Display', serif;
            font-size: 14px;
            color: var(--gold);
            font-style: italic;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ebook-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 20px 25px;
            margin-bottom: 16px;
            background: var(--surface);
            color: var(--text);
            text-decoration: none;
            border-radius: 4px;
            border: 1px solid var(--border);
            font-size: 15px;
            letter-spacing: 0.3px;
            text-align: left;
            opacity: 0;
            animation: fadeUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            transition: all 0.3s ease;
        }

        .chapter-num {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 14px;
            font-weight: 600;
            font-style: italic;
            margin-right: 15px;
            min-width: 28px;
        }

        .ebook-title {
            flex-grow: 1;
        }

        .arrow {
            color: var(--muted);
            font-size: 18px;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .ebook-card:hover {
            border-color: var(--gold);
            background: #1E1B19;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: translateY(-2px);
        }

        .ebook-card:hover .arrow {
            transform: translateX(5px);
            color: var(--gold);
        }

        .ebook-card:active {
            transform: translateY(0);
            border-color: var(--muted);
        }

        .empty, .error {
            color: var(--gold);
            font-size: 14px;
            font-weight: 300;
            line-height: 1.6;
        }

        .error span {
            color: var(--muted);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">B.</div>
        <h1>Bibliothèque Privée</h1>
        <div id="menu">
            <p class="loading" id="status">Ouverture des archives...</p>
        </div>
    </div>

    <script>
    const CONFIG = {
     githubUser: "incognitoresolve-alt",
     repo: "Ebook",
     branch: "main"
};

        const API_URL = `https://api.github.com/repos/${CONFIG.githubUser}/${CONFIG.repo}/contents/`;
        const CACHE_KEY = `bprod_ebooks_${CONFIG.repo}`;
        const menu = document.getElementById('menu');
        const status = document.getElementById('status');

        const ROMAN = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV"];

        const toRoman = (n) => ROMAN[n] || String(n + 1);

        const cleanTitle = (filename) =>
            filename
                .replace(/\.html$/i, '')
                .replace(/[-_]/g, ' ')
                .replace(/^\w/, (c) => c.toUpperCase());

        const createCard = (file, index) => {
            const a = document.createElement('a');
            a.className = 'ebook-card';
            a.href = file.name;  // Lien relatif = même dossier
            a.style.animationDelay = `${index * 0.12}s`;
            a.innerHTML = `
                <span class="chapter-num">${toRoman(index)}.</span>
                <span class="ebook-title">${cleanTitle(file.name)}</span>
                <span class="arrow">→</span>
            `;
            return a;
        };

        const render = (files) => {
            status.style.display = 'none';
            if (!files.length) {
                menu.innerHTML = '<p class="empty">Les archives sont actuellement vides.</p>';
                return;
            }
            const frag = document.createDocumentFragment();
            files.forEach((f, i) => frag.appendChild(createCard(f, i)));
            menu.appendChild(frag);
        };

        const fetchEbooks = async () => {
            // 1. Cache session
            const cached = sessionStorage.getItem(CACHE_KEY);
            if (cached) { render(JSON.parse(cached)); return; }

            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                // Filtre : fichiers .html (hors index.html) présents à la racine
                const ebooks = data.filter(item =>
                    item.type === 'file' &&
                    item.name.toLowerCase().endsWith('.html') &&
                    item.name.toLowerCase() !== 'index.html'
                );

                sessionStorage.setItem(CACHE_KEY, JSON.stringify(ebooks));
                render(ebooks);
            } catch (err) {
                console.error(err);
                status.className = 'error';
                status.innerHTML = `Accès aux archives indisponible.<br><span>Vérifie la configuration ou réessaie plus tard.</span>`;
            }
        };

        fetchEbooks();
    </script>
</body>
</html>
