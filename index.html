<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les eBooks de Boris</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --text-color: #2c3e50;
            --btn-bg: #2c3e50;
            --btn-text: #ffffff;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 40px 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #bdc3c7;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: white;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        p.bio {
            font-size: 15px;
            color: #7f8c8d;
            margin-bottom: 40px;
        }

        .loading {
            font-size: 15px;
            color: #95a5a6;
            font-style: italic;
        }

        /* Animation d'apparition des boutons */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ebook-link {
            display: block;
            width: 100%;
            padding: 18px;
            margin-bottom: 15px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            text-decoration: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, background-color 0.2s;
            box-sizing: border-box;
            text-align: left;
            animation: fadeIn 0.4s ease-out forwards;
        }

        .ebook-link:active {
            transform: scale(0.98);
        }
        
        .ebook-link:hover {
            background-color: #1a252f;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-img">BPROD</div>
        <h1>Ressources Exclusives</h1>
        <p class="bio">Découvrez mes stratégies et guides pratiques.</p>

        <div id="menuContainer">
            <p class="loading" id="loadingStatus">Chargement des ressources disponibles...</p>
        </div>
    </div>

    <script>
        // 🚨 CONFIGURATION 🚨
        const githubUsername = "TON_NOM_UTILISATEUR_GITHUB"; 
        const repoName = "TON_NOM_DE_REPOSITORIE";       

        const apiUrl = `https://api.github.com/repos/${githubUsername}/${repoName}/contents/`;
        const cacheKey = `ebooks_${repoName}`; // Clé unique pour le cache

        const menuContainer = document.getElementById('menuContainer');
        const loadingStatus = document.getElementById('loadingStatus');

        // Formater le titre (ex: "budget-maitrise.html" -> "Budget maitrise")
        function cleanTitle(filename) {
            let nameWithoutExtension = filename.replace('.html', '');
            let cleanName = nameWithoutExtension.replace(/-/g, ' '); 
            return cleanName.charAt(0).toUpperCase() + cleanName.slice(1);
        }

        // Afficher les liens dans le DOM
        function renderLinks(files) {
            loadingStatus.style.display = 'none';

            if (files.length === 0) {
                menuContainer.innerHTML = "<p class='bio'>Aucun eBook n'est disponible pour le moment.</p>";
                return;
            }

            files.forEach((file, index) => {
                const link = document.createElement('a');
                link.className = 'ebook-link';
                link.href = `./${file.name}`; // Garantit un chemin relatif correct
                link.textContent = "📚 " + cleanTitle(file.name);
                // Décaler légèrement l'animation pour chaque bouton
                link.style.animationDelay = `${index * 0.1}s`; 
                menuContainer.appendChild(link);
            });
        }

        // Fonction principale asynchrone
        async function fetchEbooks() {
            // 1. Vérifier si les données sont déjà en cache dans la session en cours
            const cachedData = sessionStorage.getItem(cacheKey);
            if (cachedData) {
                renderLinks(JSON.parse(cachedData));
                return; // On arrête ici, pas besoin d'appeler l'API
            }

            // 2. Si pas de cache, on appelle l'API
            try {
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error(`Erreur API: ${response.status}`);
                }
                
                const data = await response.json();
                const htmlFiles = data.filter(file => file.name.endsWith('.html') && file.name !== 'index.html');
                
                // 3. Sauvegarder dans le cache pour les prochains allers-retours
                sessionStorage.setItem(cacheKey, JSON.stringify(htmlFiles));
                
                // 4. Afficher
                renderLinks(htmlFiles);

            } catch (error) {
                console.error("Erreur de chargement :", error);
                loadingStatus.textContent = "Impossible de charger la liste des eBooks pour le moment.";
            }
        }

        // Lancement du script
        fetchEbooks();
    </script>

</body>
</html>
